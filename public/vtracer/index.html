<!doctype html>
<html><head><meta charset="utf-8"><title>Better Cricut VTracer Worker</title></head>
<body>
  <input id="imageInput" type="file" accept="image/*">
  <button id="imageSelect"></button><button id="export"></button>
  <div id="drop"><div id="droptext"></div></div>
  <div id="canvas-container"><canvas id="frame"></canvas><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="progressregion"><progress id="progressbar" value="0" max="100"></progress></div>
  <div id="galleryslider"></div><div id="credits-modal-content"></div>
  <button id="none"></button><button id="polygon"></button><button id="spline"></button>
  <button id="clustering-binary"></button><button id="clustering-color"></button>
  <button id="clustering-cutout"></button><button id="clustering-stacked"></button>
  <span id="filterspecklevalue"></span><input id="filterspeckle" value="8">
  <span id="colorprecisionvalue"></span><input id="colorprecision" value="6">
  <span id="layerdifferencevalue"></span><input id="layerdifference" value="16">
  <span id="cornervalue"></span><input id="corner" value="60">
  <span id="lengthvalue"></span><input id="length" value="4">
  <span id="splicevalue"></span><input id="splice" value="45">
  <span id="pathprecisionvalue"></span><input id="pathprecision" value="3">
  <script src="./bootstrap.js"></script>
</body></html>
